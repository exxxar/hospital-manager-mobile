name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Необязательно: без переменной собирается автономная DEMO-версия.
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Validate project files
        run: |
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

      - name: Validate optional API_BASE_URL
        shell: bash
        run: |
          if [[ -z "${API_BASE_URL}" ]]; then
            echo "API_BASE_URL is not set; building offline DEMO configuration."
            exit 0
          fi
          if [[ ! "${API_BASE_URL}" =~ ^https://[^[:space:]]+/api/v1/$ ]]; then
            echo "Invalid API_BASE_URL. Expected https://host/api/v1/ (with trailing slash)." >&2
            exit 1
          fi
          if [[ "${API_BASE_URL}" == *example.com* ]]; then
            echo "API_BASE_URL still contains the example.com placeholder." >&2
            exit 1
          fi
          echo "API_BASE_URL format is valid."

      - name: Compile debug Kotlin and package APK
        run: gradle --no-daemon --stacktrace -p android clean assembleDebug

      - name: Run unit tests (if present)
        run: gradle --no-daemon --stacktrace -p android testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clinic-staff-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
